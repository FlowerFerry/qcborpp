name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════
  #  Windows MSVC
  # ═══════════════════════════════════════════════
  windows-msvc-x64:
    name: Windows (MSVC x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  windows-msvc-x86:
    name: Windows (MSVC x86)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A Win32
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # ═══════════════════════════════════════════════
  #  Linux GCC
  # ═══════════════════════════════════════════════
  linux-gcc-x64:
    name: Linux (GCC x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-gcc-x86:
    name: Linux (GCC x86)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-multilib g++-multilib
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS=-m32
          -DCMAKE_CXX_FLAGS=-m32
          -DCMAKE_EXE_LINKER_FLAGS=-m32
          -DCMAKE_LIBRARY_PATH=/usr/lib32
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-gcc-armv7l:
    name: Linux (GCC armv7l)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            libc6-armhf-cross qemu-user
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=Linux
          -DCMAKE_SYSTEM_PROCESSOR=arm
          -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc
          -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++
          -DCMAKE_FIND_ROOT_PATH=/usr/arm-linux-gnueabihf
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120
        env:
          QEMU_LD_PREFIX: /usr/arm-linux-gnueabihf

  linux-gcc-aarch64:
    name: Linux (GCC aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ═══════════════════════════════════════════════
  #  Linux Clang
  # ═══════════════════════════════════════════════
  linux-clang-x64:
    name: Linux (Clang x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-clang-x86:
    name: Linux (Clang x86)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang gcc-multilib g++-multilib
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_FLAGS=-m32
          -DCMAKE_CXX_FLAGS=-m32
          -DCMAKE_EXE_LINKER_FLAGS=-m32
          -DCMAKE_LIBRARY_PATH=/usr/lib32
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
